<div class="flex h-full flex-col border-r border-slate-700 bg-slate-800 text-slate-100">
  <div class="flex h-16 items-center gap-3 border-b border-slate-700 px-5">
    <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-emerald-500 font-bold text-slate-900">
      HV
    </div>
    <div class="min-w-0">
      <p class="truncate text-sm font-semibold text-white">{{ appName() }}</p>
      <p class="text-[11px] uppercase tracking-wider text-slate-400">
        Panel administrativo
      </p>
    </div>
  </div>
  <div class="flex-1 overflow-y-auto p-3">
    <nav aria-label="Navegación principal" (click)="onNavigationClick($event)">
      <p-panelmenu [model]="items()" [multiple]="true" />
    </nav>
  </div>
  @if (showSession()) {
    <div class="border-t border-slate-700 p-4">
      <p class="text-sm font-medium text-white">{{ username() || 'Invitado' }}</p>
      <p class="text-xs text-slate-400">{{ roleLabel() }}</p>
      <div class="mt-3 flex items-center justify-between text-xs text-slate-400">
        <span>{{ permissionCount() }} permisos</span>
        <button
          pButton
          type="button"
          text
          rounded
          aria-label="Cerrar sesión"
          (click)="logoutRequested.emit()"
        >
          <i pButtonIcon class="pi pi-sign-out"></i>
        </button>
      </div>
    </div>
  }
</div>
