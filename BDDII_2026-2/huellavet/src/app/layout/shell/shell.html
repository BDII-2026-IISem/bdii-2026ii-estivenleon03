<p-toast />
<p-confirmDialog />

<div class="flex min-h-screen flex-col bg-slate-900 text-slate-100">
  <app-header (menuRequested)="onMenuToggle()" />
  <div class="flex flex-1 overflow-hidden">
    @if (!sidebarCollapsed()) {
      <aside class="hidden w-72 shrink-0 lg:block border-r border-slate-700 bg-slate-800">
        <app-aside [items]="items()" (navigated)="mobileOpen.set(false)" />
      </aside>
    }
    <main id="contenido" class="min-w-0 flex-1 p-4 sm:p-6 overflow-y-auto">
      <router-outlet />
    </main>
  </div>
  <app-footer />
</div>

<p-drawer [(visible)]="mobileOpen" header="Menú" position="left" styleClass="w-72">
  <app-aside [items]="items()" (navigated)="mobileOpen.set(false)" />
</p-drawer>
