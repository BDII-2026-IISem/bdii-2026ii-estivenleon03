<form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-4 text-slate-100">
  <div class="flex flex-col gap-2">
    <label for="pt-name" class="text-sm font-semibold text-slate-200">
      Nombre del Tipo / Categoría <span class="text-red-500">*</span>
    </label>
    <input
      id="pt-name"
      pInputText
      formControlName="name"
      class="w-full bg-slate-800 text-white border-slate-600"
      placeholder="Ej. Vacunas, Medicamentos, Cirugía"
      autocomplete="off"
    />
    @if (form.controls.name.touched && form.controls.name.invalid) {
      <p-message severity="error" size="small" variant="simple">
        El nombre debe tener entre 2 y 100 caracteres y no puede contener solo espacios.
      </p-message>
    }
  </div>

  <div class="flex flex-col gap-2">
    <label for="pt-description" class="text-sm font-semibold text-slate-200">Descripción</label>
    <textarea
      id="pt-description"
      pTextarea
      formControlName="description"
      rows="3"
      placeholder="Descripción opcional del tipo o categoría..."
      maxlength="255"
      class="w-full bg-slate-800 text-white border-slate-600"
    ></textarea>
    @if (form.controls.description.touched && form.controls.description.invalid) {
      <p-message severity="error" size="small" variant="simple">
        La descripción puede tener máximo 255 caracteres.
      </p-message>
    }
  </div>

  <div class="flex justify-end gap-2 border-t border-slate-700 pt-4">
    <button pButton type="button" severity="secondary" outlined (click)="cancelled.emit()">
      <span pButtonLabel>Cancelar</span>
    </button>
    <button pButton type="submit" severity="success" [loading]="saving()">
      <i pButtonIcon class="pi pi-check"></i>
      <span pButtonLabel>Guardar</span>
    </button>
  </div>
</form>
