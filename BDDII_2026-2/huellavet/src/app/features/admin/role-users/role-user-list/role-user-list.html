<app-page-header title="Asignación de Roles a Usuarios" subtitle="Vinculación entre usuarios y perfiles.">
  <button *appHasPermission="'POST /api/role-users'" pButton type="button" severity="success" (click)="openCreate()">
    <i pButtonIcon class="pi pi-link"></i>
    <span pButtonLabel>Nueva Asignación</span>
  </button>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">{{ error() }}</p-message>
}

<p-table [value]="visibleRows()" [loading]="loading()" dataKey="id" tableStyleClass="min-w-3xl" [paginator]="visibleRows().length > 10" [rows]="10">
  <ng-template #caption>
    <input pInputText type="search" class="w-full bg-slate-800 text-white border-slate-600" aria-label="Buscar asignaciones" placeholder="Buscar por usuario o rol..." [value]="filter()" (input)="filter.set($any($event.target).value)" />
  </ng-template>

  <ng-template #header>
    <tr>
      <th>Usuario</th>
      <th>Rol Asignado</th>
      <th>Estado</th>
      <th class="w-28 text-right">Acciones</th>
    </tr>
  </ng-template>

  <ng-template #body let-row>
    <tr>
      <td class="font-medium text-white">{{ userLabel(row.userId) }}</td>
      <td class="text-indigo-400 font-semibold">{{ roleLabel(row.roleId) }}</td>
      <td><app-status-tag [status]="row.status" /></td>
      <td class="text-right">
        <button *appHasPermission="'DELETE /api/role-users/:id'" pButton type="button" text rounded severity="danger" icon="pi pi-trash" aria-label="Retirar" pTooltip="Retirar" (click)="remove(row)"></button>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="4">
        <app-empty-state icon="pi pi-link" title="Sin asignaciones" message="No hay roles vinculados a usuarios." />
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog [visible]="dialogVisible()" (visibleChange)="dialogVisible.set($event)" header="Nueva Asignación" [modal]="true" [draggable]="false" [resizable]="false" styleClass="w-full max-w-lg mx-4">
  <form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-4 text-slate-100">
    <div class="flex flex-col gap-2">
      <label for="ru-user" class="text-sm font-semibold">Usuario</label>
      <p-select inputId="ru-user" formControlName="userId" [options]="users()" optionLabel="username" optionValue="id" [filter]="true" styleClass="w-full bg-slate-800 text-white border-slate-600" appendTo="body" />
    </div>
    <div class="flex flex-col gap-2">
      <label for="ru-role" class="text-sm font-semibold">Rol</label>
      <p-select inputId="ru-role" formControlName="roleId" [options]="roles()" optionLabel="name" optionValue="id" [filter]="true" styleClass="w-full bg-slate-800 text-white border-slate-600" appendTo="body" />
    </div>
    <div class="flex items-end justify-end gap-2 pt-4 border-t border-slate-700">
      <button pButton type="button" severity="secondary" outlined (click)="dialogVisible.set(false)"><span pButtonLabel>Cancelar</span></button>
      <button pButton type="submit" severity="success" [loading]="saving()"><span pButtonLabel>Asignar</span></button>
    </div>
  </form>
</p-dialog>
