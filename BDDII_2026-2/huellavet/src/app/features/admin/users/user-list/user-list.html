<app-page-header title="Gestión de Usuarios" subtitle="Administración de cuentas del sistema.">
  <button *appHasPermission="'POST /api/users'" pButton type="button" severity="success" (click)="openCreate()">
    <i pButtonIcon class="pi pi-user-plus"></i>
    <span pButtonLabel>Nuevo Usuario</span>
  </button>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">{{ error() }}</p-message>
}

<p-table [value]="visibleRows()" [loading]="loading()" dataKey="id" tableStyleClass="min-w-3xl" [paginator]="visibleRows().length > 10" [rows]="10">
  <ng-template #caption>
    <input pInputText type="search" class="w-full bg-slate-800 text-white border-slate-600" aria-label="Buscar usuarios" placeholder="Buscar por usuario o email..." [value]="filter()" (input)="filter.set($any($event.target).value)" />
  </ng-template>

  <ng-template #header>
    <tr>
      <th>Usuario</th>
      <th>Avatar</th>
      <th>Estado</th>
      <th class="w-36 text-right">Acciones</th>
    </tr>
  </ng-template>

  <ng-template #body let-row>
    <tr>
      <td>
        <p class="font-medium text-white">{{ row.username }}</p>
        <p class="text-xs text-slate-400">#{{ row.id }} · {{ row.email }}</p>
      </td>
      <td>
        @if (row.avatar) {
          <img [src]="row.avatar" [alt]="'Avatar de ' + row.username" class="h-8 w-8 rounded-full object-cover" />
        } @else {
          <span class="text-xs text-slate-400">Sin avatar</span>
        }
      </td>
      <td>
        <app-status-tag [status]="row.status" />
      </td>
      <td class="text-right">
        <button pButton type="button" text rounded severity="secondary" icon="pi pi-key" aria-label="Ver permisos" pTooltip="Ver permisos" (click)="openPermissions(row)"></button>
        <button *appHasPermission="'PATCH /api/users/:id'" pButton type="button" text rounded severity="info" icon="pi pi-pencil" aria-label="Editar" pTooltip="Editar" (click)="openEdit(row)"></button>
        <button *appHasPermission="'DELETE /api/users/:id'" pButton type="button" text rounded severity="danger" icon="pi pi-trash" aria-label="Desactivar" pTooltip="Desactivar" (click)="remove(row)"></button>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="4">
        <app-empty-state icon="pi pi-users" title="Sin usuarios" message="No se encontraron cuentas de usuario." />
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog [visible]="dialogVisible()" (visibleChange)="dialogVisible.set($event)" [header]="editing() ? 'Editar usuario' : 'Nuevo usuario'" [modal]="true" [draggable]="false" [resizable]="false" styleClass="w-full max-w-2xl mx-4">
  <form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-4 md:grid-cols-2 text-slate-100">
    <div class="flex flex-col gap-2">
      <label for="u-name" class="text-sm font-semibold">Usuario</label>
      <input id="u-name" pInputText formControlName="username" class="w-full bg-slate-800 text-white border-slate-600" />
    </div>
    <div class="flex flex-col gap-2">
      <label for="u-mail" class="text-sm font-semibold">Email</label>
      <input id="u-mail" type="email" pInputText formControlName="email" class="w-full bg-slate-800 text-white border-slate-600" />
    </div>
    <div class="flex flex-col gap-2">
      <label for="u-pass" class="text-sm font-semibold">Contraseña {{ editing() ? '(sin cambios)' : '' }}</label>
      <p-password inputId="u-pass" formControlName="password" [feedback]="false" [fluid]="true" inputStyleClass="w-full bg-slate-800 text-white border-slate-600" />
    </div>
    <div class="flex flex-col gap-2">
      <label for="u-avatar" class="text-sm font-semibold">Avatar (URL)</label>
      <input id="u-avatar" pInputText formControlName="avatar" class="w-full bg-slate-800 text-white border-slate-600" />
    </div>
    <div class="flex flex-col gap-2">
      <label for="u-status" class="text-sm font-semibold">Estado</label>
      <p-select inputId="u-status" formControlName="status" [options]="statusOptions" optionLabel="label" optionValue="value" styleClass="w-full bg-slate-800 text-white border-slate-600" appendTo="body" />
    </div>
    <div class="flex items-end justify-end gap-2 md:col-span-2 pt-4 border-t border-slate-700">
      <button pButton type="button" severity="secondary" outlined (click)="dialogVisible.set(false)"><span pButtonLabel>Cancelar</span></button>
      <button pButton type="submit" severity="success" [loading]="saving()"><span pButtonLabel>Guardar</span></button>
    </div>
  </form>
</p-dialog>

<p-dialog [visible]="!!permissionsUser()" (visibleChange)="permissionsUser.set(null)" [header]="'Permisos de ' + (permissionsUser()?.username ?? '')" [modal]="true" [draggable]="false" [resizable]="false" styleClass="w-full max-w-2xl mx-4">
  <p-table data-testid="permisos" [value]="permissions()" [loading]="permissionsLoading()" tableStyleClass="w-full">
    <ng-template #header>
      <tr>
        <th>Método</th>
        <th>Ruta</th>
        <th>Rol</th>
      </tr>
    </ng-template>
    <ng-template #body let-row>
      <tr>
        <td><p-tag [value]="row.method" [severity]="methodSeverity(row.method)" [rounded]="true" /></td>
        <td><code class="text-xs text-emerald-400">{{ row.path }}</code></td>
        <td class="text-sm text-slate-300">{{ row.roleName }}</td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="3"><app-empty-state icon="pi pi-key" title="Sin permisos" message="Este usuario no posee concesiones activas." /></td>
      </tr>
    </ng-template>
  </p-table>
</p-dialog>
