<app-page-header title="Gestión de Roles" subtitle="Definición de perfiles de acceso.">
  <button *appHasPermission="'POST /api/roles'" pButton type="button" severity="success" (click)="openCreate()">
    <i pButtonIcon class="pi pi-plus"></i>
    <span pButtonLabel>Nuevo Rol</span>
  </button>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">{{ error() }}</p-message>
}

<p-table [value]="visibleRows()" [loading]="loading()" dataKey="id" tableStyleClass="min-w-3xl" [paginator]="visibleRows().length > 10" [rows]="10">
  <ng-template #caption>
    <input pInputText type="search" class="w-full bg-slate-800 text-white border-slate-600" aria-label="Buscar roles" placeholder="Buscar por nombre o descripción..." [value]="filter()" (input)="filter.set($any($event.target).value)" />
  </ng-template>

  <ng-template #header>
    <tr>
      <th>Rol</th>
      <th>Descripción</th>
      <th>Estado</th>
      <th class="w-28 text-right">Acciones</th>
    </tr>
  </ng-template>

  <ng-template #body let-row>
    <tr>
      <td>
        <p class="font-medium text-white">{{ row.name }}</p>
        <p class="text-xs text-slate-400">#{{ row.id }}</p>
      </td>
      <td>
        <p class="text-sm text-slate-300">{{ row.description || '—' }}</p>
      </td>
      <td>
        <app-status-tag [status]="row.status" />
      </td>
      <td class="text-right">
        <button *appHasPermission="'PATCH /api/roles/:id'" pButton type="button" text rounded severity="info" icon="pi pi-pencil" aria-label="Editar" pTooltip="Editar" (click)="openEdit(row)"></button>
        <button *appHasPermission="'DELETE /api/roles/:id'" pButton type="button" text rounded severity="danger" icon="pi pi-trash" aria-label="Desactivar" pTooltip="Desactivar" (click)="remove(row)"></button>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="4">
        <app-empty-state icon="pi pi-id-card" title="Sin roles" message="No se encontraron roles configurados." />
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog [visible]="dialogVisible()" (visibleChange)="dialogVisible.set($event)" [header]="editing() ? 'Editar rol' : 'Nuevo rol'" [modal]="true" [draggable]="false" [resizable]="false" styleClass="w-full max-w-xl mx-4">
  <form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-4 text-slate-100">
    <div class="flex flex-col gap-2">
      <label for="r-name" class="text-sm font-semibold">Nombre del Rol</label>
      <input id="r-name" pInputText formControlName="name" class="w-full bg-slate-800 text-white border-slate-600" placeholder="Ej. ADMIN, VETERINARIO" />
    </div>
    <div class="flex flex-col gap-2">
      <label for="r-desc" class="text-sm font-semibold">Descripción</label>
      <textarea id="r-desc" pTextarea formControlName="description" rows="3" class="w-full bg-slate-800 text-white border-slate-600"></textarea>
    </div>
    <div class="flex flex-col gap-2">
      <label for="r-status" class="text-sm font-semibold">Estado</label>
      <p-select inputId="r-status" formControlName="status" [options]="statusOptions" optionLabel="label" optionValue="value" styleClass="w-full bg-slate-800 text-white border-slate-600" appendTo="body" />
    </div>
    <div class="flex items-end justify-end gap-2 pt-4 border-t border-slate-700">
      <button pButton type="button" severity="secondary" outlined (click)="dialogVisible.set(false)"><span pButtonLabel>Cancelar</span></button>
      <button pButton type="submit" severity="success" [loading]="saving()"><span pButtonLabel>Guardar</span></button>
    </div>
  </form>
</p-dialog>
