<div class="flex min-h-screen flex-col bg-slate-900 text-slate-100">
  <app-header (menuRequested)="onMenuToggle()" />
  <div class="flex flex-1 overflow-hidden">
    @if (!sidebarCollapsed()) {
      <aside class="hidden w-72 shrink-0 lg:block border-r border-slate-700 bg-slate-800">
        <app-aside [items]="items" (navigated)="mobileOpen.set(false)" />
      </aside>
    }
    <main id="contenido" class="min-w-0 flex-1 p-4 sm:p-6 overflow-y-auto">
      <p-card class="block">
        <h1 class="text-2xl font-semibold text-white">{{ title() }}</h1>
        <p class="mt-3 text-slate-300">
          Bienvenido a HuellaVet. Elige una opción del menú para explorar la estructura.
        </p>
        <p class="mt-2 text-sm text-slate-400">
          Esta primera pantalla usa datos locales. Los formularios y la conexión con la API Django se incorporan después.
        </p>
      </p-card>
    </main>
  </div>
  <app-footer />
</div>

<p-drawer [(visible)]="mobileOpen" header="Menú" position="left" styleClass="w-72">
  <app-aside [items]="items" (navigated)="mobileOpen.set(false)" />
</p-drawer>
